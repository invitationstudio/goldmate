<!DOCTYPE html>
<html lang="en" translate="no">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <meta name="google" content="notranslate" />
    <title>Admin Panel - GoldMate</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background: linear-gradient(145deg, #1a0f00 0%, #2c1a05 100%);
            min-height: 100vh; display: flex;
            justify-content: center; align-items: center; padding: 16px;
        }
        .app-container {
            max-width: 480px; width: 100%;
            background: linear-gradient(180deg, #faf3e0 0%, #f5e6c8 100%);
            border-radius: 32px; padding: 20px 16px 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8), 0 0 0 2px #b8860b inset, 0 0 0 4px #daa520 inset;
            position: relative; overflow: hidden;
        }
        .main-heading {
            text-align: center; font-size: 24px; font-weight: 800;
            color: #7a5d2e; letter-spacing: 2px;
            padding-bottom: 12px; border-bottom: 3px double #b8860b;
            margin-bottom: 18px;
        }
        .main-heading span { color: #b8860b; }
        .main-heading .sub {
            font-size: 14px; font-weight: 600;
            color: #5a3f0a; display: block; margin-top: 4px;
        }
        .back-btn {
            display: inline-block; padding: 8px 20px;
            border: none; border-radius: 30px;
            font-size: 15px; font-weight: 700; color: #fff;
            background: linear-gradient(145deg, #1a6a8a, #0f4a62);
            box-shadow: 0 4px 0 #08303f; cursor: pointer;
            text-decoration: none; margin-bottom: 16px;
            margin-right: 6px;
        }
        .logout-btn {
            display: inline-block; padding: 8px 16px;
            border: none; border-radius: 30px;
            font-size: 14px; font-weight: 700; color: #fff;
            background: linear-gradient(145deg, #cc0000, #990000);
            box-shadow: 0 4px 0 #660000; cursor: pointer;
            margin-bottom: 16px;
        }
        .admin-section {
            background: #fffbf0; border-radius: 16px;
            padding: 16px 14px; border: 2px solid #c9a05c;
            margin-bottom: 16px;
        }
        .admin-section .section-title {
            font-size: 17px; font-weight: 800;
            color: #5a3f0a; text-align: center;
            margin-bottom: 12px;
        }
        .search-bar {
            width: 100%; padding: 10px 14px;
            margin-bottom: 12px;
            border: 2px solid #b8860b;
            border-radius: 30px;
            background: #fffcf5;
            font-size: 14px; font-weight: 600;
            color: #3d2b06; outline: none;
        }
        .search-bar:focus {
            border-color: #daa520;
            box-shadow: 0 0 0 3px rgba(218, 165, 32, 0.3);
        }
        .select-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
        .select-row .sel-group {
            display: flex; align-items: center; gap: 6px;
            flex: 1; min-width: 110px;
        }
        .select-row .sel-group label {
            font-weight: 700; color: #5a3f0a;
            font-size: 14px; white-space: nowrap;
        }
        .select-row .sel-group select {
            flex: 1; padding: 8px 6px;
            border: 2px solid #b8860b; border-radius: 10px;
            background: #fffcf5; font-weight: 700;
            font-size: 15px; color: #3d2b06;
            outline: none; cursor: pointer; min-width: 60px;
        }
        .btn-gold-sm {
            padding: 10px 16px; border: none;
            border-radius: 30px; font-size: 14px;
            font-weight: 700; color: #fff;
            background: linear-gradient(145deg, #b8860b, #8b6914);
            box-shadow: 0 4px 0 #5a3f0a; cursor: pointer;
            flex: 1; min-width: 80px;
        }
        .btn-gold-sm.red {
            background: linear-gradient(145deg, #cc0000, #990000);
            box-shadow: 0 4px 0 #660000;
        }
        .btn-gold-sm.green {
            background: linear-gradient(145deg, #2d7d46, #1e5a32);
            box-shadow: 0 4px 0 #0f3a1e;
        }
        .btn-gold-sm.blue {
            background: linear-gradient(145deg, #1a6a8a, #0f4a62);
            box-shadow: 0 4px 0 #08303f;
        }
        .btn-group {
            display: flex; gap: 10px;
            flex-wrap: wrap; margin-top: 8px;
        }
        .status-msg {
            text-align: center; font-size: 13px;
            font-weight: 600; color: #2d7d46;
            margin-top: 8px; min-height: 24px;
        }
        .status-msg.error { color: #cc0000; }

        .oos-list { margin-top: 12px; max-height: 300px; overflow-y: auto; }
        .oos-item {
            display: flex; justify-content: space-between;
            align-items: center; padding: 8px 10px;
            background: #f5e6c8; border-radius: 10px;
            border: 1px solid #d4b48c; margin-bottom: 6px;
            gap: 6px;
        }
        .oos-item .oos-label {
            font-weight: 600; color: #5a3f0a;
            font-size: 13px; flex: 1;
            display: flex; align-items: center; gap: 6px;
        }
        .oos-item .oos-label .badge {
            background: #cc0000; color: #fff;
            padding: 2px 8px; border-radius: 20px;
            font-size: 9px; font-weight: 700;
        }
        .oos-item .remove-btn {
            padding: 4px 10px; border: none;
            border-radius: 20px; font-size: 11px;
            font-weight: 700; color: #fff;
            background: linear-gradient(145deg, #cc0000, #990000);
            box-shadow: 0 3px 0 #660000; cursor: pointer;
        }

        .user-card {
            background: #f5e6c8; border-radius: 12px;
            padding: 10px 12px; border: 1px solid #d4b48c;
            margin-bottom: 8px;
        }
        .user-card .user-name {
            font-weight: 700; color: #5a3f0a;
            font-size: 13px; margin-bottom: 2px;
        }
        .user-card .user-email {
            font-size: 11px; color: #999;
            margin-bottom: 8px;
        }
        .user-card .perm-buttons {
            display: flex; gap: 6px; flex-wrap: wrap;
        }
        .perm-btn {
            padding: 4px 10px; border: none;
            border-radius: 20px; font-size: 10px;
            font-weight: 700; cursor: pointer;
            color: #fff;
        }
        .perm-btn.on {
            background: linear-gradient(145deg, #2d7d46, #1e5a32);
            box-shadow: 0 2px 0 #0f3a1e;
        }
        .perm-btn.off {
            background: linear-gradient(145deg, #cc0000, #990000);
            box-shadow: 0 2px 0 #660000;
        }
        .delete-btn {
            padding: 4px 10px; border: none;
            border-radius: 20px; font-size: 10px;
            font-weight: 700; color: #fff;
            background: linear-gradient(145deg, #8b0000, #5a0000);
            box-shadow: 0 2px 0 #3a0000; cursor: pointer;
            margin-left: auto;
        }
        .empty-msg {
            text-align: center; color: #999;
            font-size: 14px; padding: 16px 0;
            font-style: italic;
        }
        .no-perms {
            text-align: center; padding: 24px;
            color: #cc0000; font-weight: 700;
        }
        @media (max-width: 400px) {
            .app-container { padding: 14px 10px 20px; }
            .main-heading { font-size: 20px; }
            .perm-btn { font-size: 9px; padding: 3px 8px; }
            .delete-btn { font-size: 9px; padding: 3px 8px; }
        }
    </style>
</head>
<body>

<div class="app-container" id="adminApp" style="display:none;">

    <div class="main-heading">
        🔐 Admin <span>Panel</span>
        <span class="sub">Manage Users & Out of Stock</span>
    </div>

    <a href="index.html" class="back-btn">⬅️ Back</a>
    <button class="logout-btn" onclick="adminLogout()">🚪 Logout</button>

    <div class="admin-section">
        <div class="section-title">👥 User Management</div>
        <input type="text" id="userSearch" class="search-bar" placeholder="🔍 Search by name or email..." oninput="filterUsers()" />
        <div id="userList" class="oos-list">
            <div class="empty-msg">Loading users...</div>
        </div>
        <div class="btn-group">
            <button class="btn-gold-sm blue" onclick="loadUsers()">🔄 Refresh Users</button>
        </div>
    </div>

    <div class="admin-section">
        <div class="section-title">➕ Add Out of Stock</div>
        <div class="select-row">
            <div class="sel-group">
                <label>🔢 No.</label>
                <select id="adminNumber">
                    <option value="000">000</option>
                    <option value="00">00</option>
                    <option value="0">0</option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                </select>
            </div>
            <div class="sel-group">
                <label>📂 Type</label>
                <select id="adminType">
                    <option value="Regular">Regular</option>
                    <option value="D.Tik">D.Tik</option>
                    <option value="Jad Dandi">Jad Dandi</option>
                    <option value="Puneri">Puneri</option>
                </select>
            </div>
        </div>
        <div class="btn-group">
            <button class="btn-gold-sm red" onclick="addOutOfStock()">🚫 Mark Out of Stock</button>
        </div>
        <div class="status-msg" id="adminStatusMsg"></div>
    </div>

    <div class="admin-section">
        <div class="section-title">📋 Current Out of Stock</div>
        <div class="oos-list" id="oosList"></div>
        <div class="btn-group">
            <button class="btn-gold-sm blue" onclick="loadOutOfStockFromFirestore()">🔄 Refresh</button>
            <button class="btn-gold-sm red" onclick="clearAllOutOfStock()">🗑️ Clear All</button>
        </div>
    </div>

</div>

<div class="app-container" id="noAccess" style="display:none;">
    <div class="main-heading">🔐 Admin Panel</div>
    <div class="no-perms">
        ⛔ Access Denied<br><br>
        <small style="font-size:12px;">Only admin users can access this panel.</small>
    </div>
    <a href="index.html" class="back-btn">⬅️ Back to App</a>
</div>

<!-- FIREBASE SDK -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc, collection, getDocs, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyC_Lzy7_WLyiRdR0O6u2CDRnyHcd1FT7Kc",
        authDomain: "goldmate-app.firebaseapp.com",
        projectId: "goldmate-app",
        storageBucket: "goldmate-app.firebasestorage.app",
        messagingSenderId: "1017053283285",
        appId: "1:1017053283285:web:6473485d041cfee8e0335c"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    window.fbAuth = auth;
    window.fbDB = db;
    window.fbSignOut = signOut;
    window.fbDoc = doc;
    window.fbGetDoc = getDoc;
    window.fbSetDoc = setDoc;
    window.fbCollection = collection;
    window.fbGetDocs = getDocs;
    window.fbUpdateDoc = updateDoc;
    window.fbDeleteDoc = deleteDoc;

    console.log('🔥 Admin Firebase initialized');

    onAuthStateChanged(auth, async (user) => {
        if (!user) {
            window.location.href = 'index.html';
            return;
        }

        try {
            const userDoc = await getDoc(doc(db, 'users', user.uid));
            if (userDoc.exists() && userDoc.data().isAdmin === true) {
                document.getElementById('adminApp').style.display = 'block';
                document.getElementById('noAccess').style.display = 'none';
                loadUsers();
                loadOutOfStockFromFirestore();
                console.log('✅ Admin access granted');
            } else {
                document.getElementById('adminApp').style.display = 'none';
                document.getElementById('noAccess').style.display = 'block';
                console.log('❌ Not an admin');
                setTimeout(() => { window.location.href = 'index.html'; }, 3000);
            }
        } catch (error) {
            console.error(error);
            window.location.href = 'index.html';
        }
    });
</script>

<!-- ADMIN LOGIC -->
<script>
    // ============================================================
    // 🔥 OUT OF STOCK - Firestore Management
    // ============================================================
    const OUT_OF_STOCK_DOC = 'out_of_stock';
    const SETTINGS_COLLECTION = 'settings';

    let outOfStockList = [];

    async function loadOutOfStockFromFirestore() {
        try {
            const docRef = window.fbDoc(window.fbDB, SETTINGS_COLLECTION, OUT_OF_STOCK_DOC);
            const docSnap = await window.fbGetDoc(docRef);
            
            if (docSnap.exists()) {
                const data = docSnap.data();
                outOfStockList = data.items || [];
                console.log('📦 Loaded from Firestore:', outOfStockList);
            } else {
                await window.fbSetDoc(docRef, { items: [] });
                outOfStockList = [];
                console.log('📦 Created new out_of_stock document');
            }
            renderList();
        } catch (error) {
            console.error('❌ Error loading out of stock:', error);
        }
    }

    async function saveOutOfStockToFirestore(list) {
        try {
            const docRef = window.fbDoc(window.fbDB, SETTINGS_COLLECTION, OUT_OF_STOCK_DOC);
            await window.fbSetDoc(docRef, { 
                items: list,
                updatedAt: new Date().toISOString()
            });
            console.log('✅ Saved to Firestore:', list);
        } catch (error) {
            console.error('❌ Error saving out of stock:', error);
            showAdminStatus('❌ Failed to save. Check permissions.', 'error');
        }
    }

    async function addOutOfStock() {
        const number = document.getElementById('adminNumber').value;
        const type = document.getElementById('adminType').value;
        const key = number + '|' + type;

        if (outOfStockList.includes(key)) {
            showAdminStatus(`⚠️ ${number} | ${type} is already OUT OF STOCK!`, 'error');
            return;
        }

        outOfStockList.push(key);
        await saveOutOfStockToFirestore(outOfStockList);
        renderList();
        showAdminStatus(`✅ ${number} | ${type} marked as OUT OF STOCK`, '');
    }

    async function removeOutOfStock(key) {
        outOfStockList = outOfStockList.filter(item => item !== key);
        await saveOutOfStockToFirestore(outOfStockList);
        renderList();
        showAdminStatus(`✅ Removed from OUT OF STOCK`, '');
    }

    async function clearAllOutOfStock() {
        if (confirm('Are you sure you want to remove all OUT OF STOCK items?')) {
            outOfStockList = [];
            await saveOutOfStockToFirestore(outOfStockList);
            renderList();
            showAdminStatus('🗑️ All OUT OF STOCK items cleared!', '');
        }
    }

    function renderList() {
        const container = document.getElementById('oosList');
        container.innerHTML = '';
        if (outOfStockList.length === 0) {
            container.innerHTML = `<div class="empty-msg">✅ No items out of stock</div>`;
            return;
        }
        outOfStockList.forEach(key => {
            const [number, type] = key.split('|');
            const div = document.createElement('div');
            div.className = 'oos-item';
            div.innerHTML = `
                <span class="oos-label">
                    ${number} | ${type}
                    <span class="badge">OUT</span>
                </span>
                <button class="remove-btn" onclick="removeOutOfStock('${key}')">✕</button>
            `;
            container.appendChild(div);
        });
    }

    // ============================================================
    // USER MANAGEMENT
    // ============================================================
    let allUsers = [];

    async function loadUsers() {
        const container = document.getElementById('userList');
        container.innerHTML = '<div class="empty-msg">Loading...</div>';

        try {
            const usersRef = window.fbCollection(window.fbDB, 'users');
            const snapshot = await window.fbGetDocs(usersRef);
            allUsers = [];

            if (snapshot.empty) {
                container.innerHTML = '<div class="empty-msg">No users yet</div>';
                return;
            }

            snapshot.forEach(docSnap => {
                const data = docSnap.data();
                allUsers.push({ id: docSnap.id, ...data });
            });

            renderUsers(allUsers);
        } catch (error) {
            console.error(error);
            container.innerHTML = '<div class="empty-msg" style="color:#cc0000;">Error loading users</div>';
        }
    }

    function renderUsers(users) {
        const container = document.getElementById('userList');
        container.innerHTML = '';

        if (users.length === 0) {
            container.innerHTML = '<div class="empty-msg">No users found</div>';
            return;
        }

        users.forEach(data => {
            const userId = data.id;
            const isAdmin = data.isAdmin === true;

            const div = document.createElement('div');
            div.className = 'user-card';
            div.innerHTML = `
                <div class="user-name">${data.name || 'User'} ${isAdmin ? '👑' : ''}</div>
                <div class="user-email">${data.email || ''}</div>
                <div class="perm-buttons">
                    <button class="perm-btn on" style="cursor:default;">NATH ✓</button>
                    <button class="perm-btn ${data.melting ? 'on' : 'off'}" 
                        onclick="togglePerm('${userId}', 'melting', ${!data.melting})">
                        MELT ${data.melting ? '✓' : '✗'}
                    </button>
                    <button class="perm-btn ${data.report ? 'on' : 'off'}" 
                        onclick="togglePerm('${userId}', 'report', ${!data.report})">
                        REPORT ${data.report ? '✓' : '✗'}
                    </button>
                    ${isAdmin 
                        ? `<button class="perm-btn off" onclick="toggleAdmin('${userId}', false)" style="background:linear-gradient(145deg,#8b0000,#5a0000);">👑 Remove Admin</button>`
                        : `<button class="perm-btn on" onclick="toggleAdmin('${userId}', true)" style="background:linear-gradient(145deg,#6a1a8a,#4a0f62);">👑 Make Admin</button>
                           <button class="delete-btn" onclick="deleteUser('${userId}', '${data.email}')">🗑️ Delete</button>`
                    }
                </div>
            `;
            container.appendChild(div);
        });
    }

    function filterUsers() {
        const search = document.getElementById('userSearch').value.toLowerCase().trim();
        if (!search) {
            renderUsers(allUsers);
            return;
        }
        const filtered = allUsers.filter(u => 
            (u.name || '').toLowerCase().includes(search) ||
            (u.email || '').toLowerCase().includes(search)
        );
        renderUsers(filtered);
    }

    async function togglePerm(userId, field, value) {
        try {
            const userRef = window.fbDoc(window.fbDB, 'users', userId);
            const update = {};
            update[field] = value;
            await window.fbUpdateDoc(userRef, update);
            showAdminStatus(`✅ ${field.toUpperCase()} ${value ? 'ON' : 'OFF'}`, '');
            const user = allUsers.find(u => u.id === userId);
            if (user) user[field] = value;
            filterUsers();
        } catch (error) {
            console.error(error);
            showAdminStatus('❌ Error updating permission', 'error');
        }
    }

    async function toggleAdmin(userId, makeAdmin) {
        const user = allUsers.find(u => u.id === userId);
        const userEmail = user?.email || 'this user';
        const action = makeAdmin ? 'Make Admin' : 'Remove Admin';
        
        if (!confirm(`${action}: ${userEmail}?`)) return;

        try {
            const userRef = window.fbDoc(window.fbDB, 'users', userId);
            await window.fbUpdateDoc(userRef, { isAdmin: makeAdmin });
            if (user) user.isAdmin = makeAdmin;
            filterUsers();
            showAdminStatus(`✅ ${userEmail} ${makeAdmin ? 'is now Admin 👑' : 'is no longer Admin'}`, '');
        } catch (error) {
            console.error(error);
            showAdminStatus('❌ Error updating admin status', 'error');
        }
    }

    async function deleteUser(userId, email) {
        if (!confirm(`Delete user ${email}?`)) return;
        try {
            const userRef = window.fbDoc(window.fbDB, 'users', userId);
            await window.fbDeleteDoc(userRef);
            allUsers = allUsers.filter(u => u.id !== userId);
            filterUsers();
            showAdminStatus(`✅ User ${email} deleted from Firestore`, '');
        } catch (error) {
            console.error(error);
            showAdminStatus('❌ Error deleting user', 'error');
        }
    }

    function showAdminStatus(msg, type = '') {
        const el = document.getElementById('adminStatusMsg');
        el.textContent = msg;
        el.className = 'status-msg' + (type === 'error' ? ' error' : '');
        if (msg) setTimeout(() => { if (el.textContent === msg) el.textContent = ''; }, 4000);
    }

    async function adminLogout() {
        if (confirm('Logout?')) {
            await window.fbSignOut(window.fbAuth);
        }
    }

    // 🔹 Auto-refresh users every 5 seconds
    setInterval(() => {
        if (document.getElementById('adminApp').style.display !== 'none') {
            loadUsers();
        }
    }, 5000);

    console.log('✅ Admin logic loaded with Firestore');
</script>

</body>
</html>
