<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>Admin Panel - GoldMate</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(145deg, #1a0f00 0%, #2c1a05 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }
        .app-container {
            max-width: 480px;
            width: 100%;
            background: linear-gradient(180deg, #faf3e0 0%, #f5e6c8 100%);
            border-radius: 32px;
            padding: 20px 16px 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8), 0 0 0 2px #b8860b inset, 0 0 0 4px #daa520 inset;
            position: relative;
            overflow: hidden;
        }
        .app-container::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 20%, rgba(255, 215, 0, 0.06) 0%, transparent 60%);
            pointer-events: none;
        }

        .main-heading {
            text-align: center;
            font-size: 26px;
            font-weight: 800;
            color: #7a5d2e;
            text-shadow: 0 2px 4px rgba(255, 215, 0, 0.3);
            letter-spacing: 2px;
            padding-bottom: 12px;
            border-bottom: 3px double #b8860b;
            margin-bottom: 18px;
        }
        .main-heading span { color: #b8860b; }
        .main-heading .sub {
            font-size: 16px;
            font-weight: 600;
            color: #5a3f0a;
            display: block;
            margin-top: 4px;
            border: none;
        }

        .back-btn {
            display: inline-block;
            padding: 8px 20px;
            border: none;
            border-radius: 30px;
            font-size: 15px;
            font-weight: 700;
            color: #fff;
            background: linear-gradient(145deg, #1a6a8a, #0f4a62);
            box-shadow: 0 4px 0 #08303f;
            cursor: pointer;
            transition: all 0.08s ease;
            text-decoration: none;
            margin-bottom: 16px;
        }
        .back-btn:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #08303f;
        }

        /* 🔴 नवीन Login बटणासाठी style */
        .login-btn {
            background: linear-gradient(145deg, #d4af37, #b8860b) !important;
            color: #000 !important;
            font-weight: 800 !important;
            text-shadow: none !important;
            margin-left: 8px;
        }

        /* 🔴 Logout बटणासाठी style */
        .logout-btn {
            display: inline-block;
            padding: 8px 20px;
            border: none;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 700;
            color: #fff;
            background: linear-gradient(145deg, #cc0000, #990000);
            box-shadow: 0 4px 0 #660000;
            cursor: pointer;
            transition: all 0.08s ease;
            margin-left: 8px;
            text-decoration: none;
        }
        .logout-btn:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #660000;
        }

        .admin-section {
            background: #fffbf0;
            border-radius: 16px;
            padding: 16px 14px;
            border: 2px solid #c9a05c;
            margin-bottom: 16px;
        }
        .admin-section .section-title {
            font-size: 18px;
            font-weight: 800;
            color: #5a3f0a;
            text-align: center;
            margin-bottom: 12px;
            letter-spacing: 1px;
        }

        .select-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }
        .select-row .sel-group {
            display: flex;
            align-items: center;
            gap: 6px;
            flex: 1;
            min-width: 110px;
        }
        .select-row .sel-group label {
            font-weight: 700;
            color: #5a3f0a;
            font-size: 14px;
            white-space: nowrap;
        }
        .select-row .sel-group select {
            flex: 1;
            padding: 8px 6px;
            border: 2px solid #b8860b;
            border-radius: 10px;
            background: #fffcf5;
            font-weight: 700;
            font-size: 15px;
            color: #3d2b06;
            outline: none;
            cursor: pointer;
            min-width: 60px;
        }
        .select-row .sel-group select:focus {
            border-color: #daa520;
            box-shadow: 0 0 0 3px rgba(218, 165, 32, 0.3);
        }

        .btn-gold-sm {
            padding: 10px 16px;
            border: none;
            border-radius: 30px;
            font-size: 15px;
            font-weight: 700;
            color: #fff;
            background: linear-gradient(145deg, #b8860b, #8b6914);
            box-shadow: 0 4px 0 #5a3f0a, 0 4px 12px rgba(0, 0, 0, 0.3);
            cursor: pointer;
            transition: all 0.08s ease;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.3);
            flex: 1;
            min-width: 80px;
        }
        .btn-gold-sm:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #5a3f0a;
        }
        .btn-gold-sm.red {
            background: linear-gradient(145deg, #cc0000, #990000);
            box-shadow: 0 4px 0 #660000;
        }
        .btn-gold-sm.red:active {
            box-shadow: 0 1px 0 #660000;
        }
        .btn-gold-sm.green {
            background: linear-gradient(145deg, #2d7d46, #1e5a32);
            box-shadow: 0 4px 0 #0f3a1e;
        }
        .btn-gold-sm.green:active {
            box-shadow: 0 1px 0 #0f3a1e;
        }
        .btn-gold-sm.blue {
            background: linear-gradient(145deg, #1a6a8a, #0f4a62);
            box-shadow: 0 4px 0 #08303f;
        }
        .btn-gold-sm.blue:active {
            box-shadow: 0 1px 0 #08303f;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 8px;
        }

        .status-msg {
            text-align: center;
            font-size: 13px;
            font-weight: 600;
            color: #2d7d46;
            margin-top: 8px;
            min-height: 24px;
        }
        .status-msg.error {
            color: #cc0000;
        }

        /* ===== OUT OF STOCK LIST ===== */
        .oos-list {
            margin-top: 12px;
            max-height: 250px;
            overflow-y: auto;
        }
        .oos-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: nowrap;
    padding: 8px 10px;
    background: #f5e6c8;
    border-radius: 10px;
    border: 1px solid #d4b48c;
    margin-bottom: 6px;
    gap: 6px;
    overflow: hidden;
}
        .oos-item .oos-label {
    font-weight: 600;
    color: #5a3f0a;
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: nowrap;
    white-space: nowrap;
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
}
.oos-item .oos-label .badge {
    background: #cc0000;
    color: #fff;
    padding: 2px 8px;
    border-radius: 20px;
    font-size: 9px;
    font-weight: 700;
    white-space: nowrap;
    flex-shrink: 0;
}
        .oos-item .remove-btn {
    padding: 4px 10px;
    border: none;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 700;
    color: #fff;
    background: linear-gradient(145deg, #cc0000, #990000);
    box-shadow: 0 3px 0 #660000;
    cursor: pointer;
    transition: all 0.08s ease;
    white-space: nowrap;
    flex-shrink: 0;
}
        .oos-item .remove-btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #660000;
        }

        .empty-msg {
            text-align: center;
            color: #999;
            font-size: 14px;
            padding: 16px 0;
            font-style: italic;
        }

        @media (max-width: 400px) {
            .app-container { padding: 14px 10px 20px; }
            .main-heading { font-size: 22px; }
            .select-row .sel-group select { font-size: 13px; padding: 6px 4px; }
            .btn-gold-sm { font-size: 13px; padding: 8px 4px; }
            .oos-item { font-size: 13px; }
        }

        @media (max-width: 400px) {
    /* ... आधीचे सर्व ... */
    
    .oos-item {
        padding: 6px 8px;
        gap: 4px;
    }
    .oos-item .oos-label {
        font-size: 11px;
    }
    .oos-item .oos-label .badge {
        font-size: 8px;
        padding: 2px 6px;
    }
    .oos-item .remove-btn {
        font-size: 10px;
        padding: 3px 8px;
    }
}
    </style>
</head>
<body>

<div class="app-container">

    <div class="main-heading">
        🔐 Admin <span>Panel</span>
        <span class="sub">Manage Out of Stock - NATH</span>
    </div>

    <a href="index.html" class="back-btn">⬅️ Back to App</a>
    <a href="login.html" class="back-btn login-btn">🔐 Admin Login</a>
    
    <!-- 🔴 Logout बटण (येथे add केले आहे) -->
    <button onclick="logout()" class="logout-btn">🚪 Logout</button>

    <!-- ===== ADD OUT OF STOCK ===== -->
    <div class="admin-section">
        <div class="section-title">➕ Add Out of Stock</div>

        <div class="select-row">
            <div class="sel-group">
                <label>🔢 No.</label>
                <select id="adminNumber">
                    <option value="000">000</option>
                    <option value="00">00</option>
                    <option value="0">0</option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                </select>
            </div>
            <div class="sel-group">
                <label>📂 Type</label>
                <select id="adminType">
                    <option value="Regular">Regular</option>
                    <option value="D.Tik">D.Tik</option>
                    <option value="Jad Dandi">Jad Dandi</option>
                    <option value="Puneri">Puneri</option>
                </select>
            </div>
        </div>

        <div class="btn-group">
            <button class="btn-gold-sm red" onclick="addOutOfStock()">🚫 Mark Out of Stock</button>
        </div>

        <div class="status-msg" id="adminStatusMsg"></div>
    </div>

    <!-- ===== CURRENT OUT OF STOCK LIST ===== -->
    <div class="admin-section">
        <div class="section-title">📋 Current Out of Stock</div>

        <div class="oos-list" id="oosList">
            <!-- Items will be added by JS -->
        </div>

        <div class="btn-group">
            <button class="btn-gold-sm blue" onclick="refreshList()">🔄 Refresh</button>
            <button class="btn-gold-sm red" onclick="clearAllOutOfStock()">🗑️ Clear All</button>
        </div>
    </div>

</div>

<script>
    // ================================================================
    // 🔐 LOGIN CHECK - Admin Panel फक्त Login केल्यावरच उघडेल
    // ================================================================
    
    // जर sessionStorage मध्ये "admin_logged_in" नसेल, तर login.html वर redirect करा
    if (!sessionStorage.getItem("admin_logged_in")) {
        window.location.href = "login.html";
    }

    // ================================================================
    // 🔴 LOGOUT FUNCTION
    // ================================================================
    
    function logout() {
        sessionStorage.removeItem("admin_logged_in");
        window.location.href = "login.html";
    }

    // ================================================================
    // 1. OUT OF STOCK - LocalStorage Management
    // ================================================================

    const STORAGE_KEY = 'goldmate_out_of_stock';

    function getOutOfStockList() {
        try {
            const data = localStorage.getItem(STORAGE_KEY);
            if (data) {
                return JSON.parse(data);
            }
        } catch (e) {}
        return [];
    }

    function saveOutOfStockList(list) {
        try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
        } catch (e) {}
    }

    // ================================================================
    // 2. Add / Remove / Clear
    // ================================================================

    function addOutOfStock() {
        const number = document.getElementById('adminNumber').value;
        const type = document.getElementById('adminType').value;
        const key = number + '|' + type;

        const list = getOutOfStockList();

        if (list.includes(key)) {
            showAdminStatus(`⚠️ ${number} | ${type} is already OUT OF STOCK!`, 'error');
            return;
        }

        list.push(key);
        saveOutOfStockList(list);
        renderList();
        showAdminStatus(`✅ ${number} | ${type} marked as OUT OF STOCK`, '');
        
        // 🔹 Notify main app to refresh
        try {
            localStorage.setItem('goldmate_admin_changed', Date.now().toString());
        } catch (e) {}
    }

    function removeOutOfStock(key) {
        let list = getOutOfStockList();
        list = list.filter(item => item !== key);
        saveOutOfStockList(list);
        renderList();
        showAdminStatus(`✅ Removed from OUT OF STOCK`, '');
        
        // 🔹 Notify main app to refresh
        try {
            localStorage.setItem('goldmate_admin_changed', Date.now().toString());
        } catch (e) {}
    }

    function clearAllOutOfStock() {
        if (confirm('Are you sure you want to remove all OUT OF STOCK items?')) {
            saveOutOfStockList([]);
            renderList();
            showAdminStatus('🗑️ All OUT OF STOCK items cleared!', '');
            
            // 🔹 Notify main app to refresh
            try {
                localStorage.setItem('goldmate_admin_changed', Date.now().toString());
            } catch (e) {}
        }
    }

    // ================================================================
    // 3. Render List
    // ================================================================

    function renderList() {
        const list = getOutOfStockList();
        const container = document.getElementById('oosList');
        container.innerHTML = '';

        if (list.length === 0) {
            container.innerHTML = `<div class="empty-msg">✅ No items out of stock</div>`;
            return;
        }

        list.forEach(key => {
            const [number, type] = key.split('|');
            const div = document.createElement('div');
            div.className = 'oos-item';
            div.innerHTML = `
                <span class="oos-label">
                    ${number} | ${type}
                    <span class="badge">OUT OF STOCK</span>
                </span>
                <button class="remove-btn" onclick="removeOutOfStock('${key}')">✕ Remove</button>
            `;
            container.appendChild(div);
        });
    }

    // ================================================================
    // 4. Refresh / Status
    // ================================================================

    function refreshList() {
        renderList();
        showAdminStatus('🔄 List refreshed!', '');
    }

    function showAdminStatus(msg, type = '') {
        const el = document.getElementById('adminStatusMsg');
        el.textContent = msg;
        el.className = 'status-msg' + (type === 'error' ? ' error' : '');
        if (msg) {
            setTimeout(() => {
                if (el.textContent === msg) {
                    el.textContent = '';
                    el.className = 'status-msg';
                }
            }, 4000);
        }
    }

    // ================================================================
    // 5. INIT
    // ================================================================

    renderList();

    console.log('🔐 Admin Panel loaded!');
    console.log('📦 Out of Stock items:', getOutOfStockList());
</script>

</body>
</html>
