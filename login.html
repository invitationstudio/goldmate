<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - GoldMate</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background: #000000;
            transition: 0.35s;
        }

        .container {
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 100px;
        }

        /* ===== Lamp Section ===== */
        .lamp-section {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .lamp-wrapper {
            position: relative;
            width: 200px;
            height: 200px;
        }

        .lamp {
            position: relative;
            width: 150px;
            display: block;
            margin: auto;
            cursor: pointer;
            z-index: 5;
            transition: 0.25s;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            outline: none;
        }

        .lamp:hover {
            transform: scale(1.05);
        }

        .lamp-glow {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 225, 120, 0.55), rgba(255, 225, 120, 0.18), transparent 70%);
            filter: blur(35px);
            opacity: 0;
            transition: 0.25s;
            z-index: 1;
        }

        /* ===== Login Card ===== */
        .login-card {
            width: 400px;
            padding: 40px;
            border-radius: 24px;
            background: rgba(22, 22, 22, 0.55);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 80px rgba(0, 0, 0, 0.6);
            opacity: 0;
            visibility: hidden;
            transform: translateY(20px);
            transition: 0.25s;
            text-align: center;
        }

        .login-card.show {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .login-card h1 {
            color: #ffffff;
            margin-bottom: 8px;
            font-size: 36px;
        }

        .login-card p {
            color: #bdbdbd;
            margin-bottom: 25px;
        }

        .login-card input {
            width: 100%;
            padding: 15px;
            margin-bottom: 15px;
            border: none;
            border-radius: 10px;
            outline: none;
            background: rgba(255, 255, 255, 0.08);
            color: #ffffff;
            font-size: 15px;
        }

        .login-card input:focus {
            background: rgba(255, 255, 255, 0.12);
        }

        .login-card button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 17px;
            font-weight: bold;
            background: #d4af37;
            transition: 0.3s;
        }

        .login-card button:hover {
            background: #e6c14a;
        }

        .error-msg {
            color: #ff6b6b;
            font-size: 14px;
            margin-bottom: 15px;
            display: none;
        }

        .back-btn {
            display: block;
            margin-top: 15px;
            color: #888888;
            text-decoration: none;
            font-size: 13px;
        }

        .back-btn:hover {
            color: #ffffff;
        }

        /* ===== Mobile Responsive ===== */
        @media (max-width: 768px) {
            body {
                overflow-y: auto;
            }

            .container {
                flex-direction: column;
                justify-content: center;
                align-items: center;
                gap: 30px;
                padding: 30px 20px;
                min-height: 100vh;
            }

            .lamp-wrapper {
                width: 150px;
                height: 150px;
            }

            .lamp {
                width: 110px;
            }

            .lamp-glow {
                width: 250px;
                height: 250px;
            }

            .login-card {
                width: 100%;
                max-width: 320px;
                padding: 30px 20px;
            }

            .login-card h1 {
                font-size: 30px;
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- Lamp Section -->
        <div class="lamp-section">
            <div class="lamp-wrapper">
                <div class="lamp-glow"></div>
                <img src="assets/images/lamp.png" class="lamp" id="lamp" alt="Lamp">
            </div>
        </div>

        <!-- Login Card -->
        <div class="login-card" id="loginCard">
            <h1>Admin Login</h1>
            <p>Please login to continue</p>

            <input type="text" id="username" placeholder="Username">
            <input type="password" id="password" placeholder="Password">

            <div class="error-msg" id="errorMsg">Invalid username or password!</div>

            <button id="loginBtn">Login</button>

            <a href="index.html" class="back-btn">← Back to Home</a>
        </div>

    </div>

    <script>
        const lamp = document.getElementById("lamp");
        const glow = document.querySelector(".lamp-glow");
        const loginCard = document.getElementById("loginCard");

        const usernameInput = document.getElementById("username");
        const passwordInput = document.getElementById("password");
        const loginBtn = document.getElementById("loginBtn");
        const errorMsg = document.getElementById("errorMsg");

        // ✅ योग्य युजरनेम आणि पासवर्ड
        const VALID_USERNAME = "admin";
        const VALID_PASSWORD = "1234";

        let lightOn = false;

        // लॅम्प क्लिक केल्यावर लॉगिन कार्ड दिसेल/लपेल
        lamp.addEventListener("click", () => {
            lightOn = !lightOn;

            if (lightOn) {
                document.body.style.background = "#050505";
                glow.style.opacity = "1";
                glow.style.transform = "translate(-50%, -50%) scale(1.25)";
                loginCard.classList.add("show");
                lamp.style.transform = "scale(1.08)";
            } else {
                document.body.style.background = "#000000";
                glow.style.opacity = "0";
                glow.style.transform = "translate(-50%, -50%) scale(1)";
                loginCard.classList.remove("show");
                lamp.style.transform = "scale(1)";
            }
        });

        // लॉगिन बटण क्लिक केल्यावर तपासणी
        loginBtn.addEventListener("click", () => {
            const user = usernameInput.value.trim();
            const pass = passwordInput.value.trim();

            if (user === VALID_USERNAME && pass === VALID_PASSWORD) {
                // ✅ Login यशस्वी - sessionStorage मध्ये सेट करा
                sessionStorage.setItem("admin_logged_in", "true");
                
                // ✅ Admin Panel ला redirect
                window.location.href = "admin.html";
            } else {
                errorMsg.style.display = "block";
                setTimeout(() => {
                    errorMsg.style.display = "none";
                }, 3000);
            }
        });

        // Enter दाबल्यावरही लॉगिन होईल
        passwordInput.addEventListener("keypress", (e) => {
            if (e.key === "Enter") {
                loginBtn.click();
            }
        });
    </script>

</body>
</html>
