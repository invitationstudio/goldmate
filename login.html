<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - GoldMate</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background: radial-gradient(circle at 50% 50%, #1a0f00 0%, #000000 70%);
            transition: 0.35s;
        }

        .container {
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 100px;
        }

        /* ===== Lamp Section ===== */
        .lamp-section {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .lamp-wrapper {
            position: relative;
            width: 200px;
            height: 200px;
        }

        .lamp {
            position: relative;
            width: 150px;
            display: block;
            margin: auto;
            cursor: pointer;
            z-index: 5;
            transition: 0.3s ease;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            outline: none;
            filter: drop-shadow(0 10px 30px rgba(255, 200, 80, 0.2));
        }

        .lamp:hover {
            transform: scale(1.08);
            filter: drop-shadow(0 15px 40px rgba(255, 200, 80, 0.4));
        }

        .lamp-glow {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: radial-gradient(circle,
                rgba(255, 225, 120, 0.6) 0%,
                rgba(255, 200, 80, 0.25) 30%,
                rgba(255, 180, 50, 0.08) 55%,
                transparent 75%);
            filter: blur(30px);
            opacity: 0;
            transition: 0.4s ease;
            z-index: 1;
            pointer-events: none;
        }

        /* ===== Floating Sparkles ===== */
        .sparkle {
            position: absolute;
            color: #ffd700;
            font-size: 14px;
            opacity: 0;
            pointer-events: none;
            animation: sparkleFloat 3s ease-in-out infinite;
        }
        .sparkle.s1 { top: 10%; left: 10%; animation-delay: 0s; }
        .sparkle.s2 { top: 20%; right: 15%; animation-delay: 0.6s; font-size: 10px; }
        .sparkle.s3 { bottom: 20%; left: 20%; animation-delay: 1.2s; font-size: 12px; }
        .sparkle.s4 { bottom: 10%; right: 10%; animation-delay: 1.8s; font-size: 16px; }

        @keyframes sparkleFloat {
            0%, 100% { opacity: 0; transform: translateY(0) scale(0.6); }
            50% { opacity: 1; transform: translateY(-15px) scale(1); }
        }

        .light-on .sparkle { opacity: 1; }

        /* ===== Login Card ===== */
        .login-card {
            width: 400px;
            padding: 40px 35px;
            border-radius: 24px;
            background: linear-gradient(145deg,
                rgba(30, 22, 8, 0.85),
                rgba(15, 10, 3, 0.95));
            backdrop-filter: blur(20px);
            border: 1px solid rgba(212, 175, 55, 0.25);
            box-shadow:
                0 20px 80px rgba(0, 0, 0, 0.8),
                0 0 40px rgba(212, 175, 55, 0.08),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
            opacity: 0;
            visibility: hidden;
            transform: translateY(20px) scale(0.96);
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .login-card::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: radial-gradient(circle at 30% 20%,
                rgba(212, 175, 55, 0.06) 0%, transparent 50%);
            pointer-events: none;
        }

        .login-card.show {
            opacity: 1;
            visibility: visible;
            transform: translateY(0) scale(1);
        }

        .login-logo {
            font-size: 42px;
            margin-bottom: 6px;
            filter: drop-shadow(0 4px 12px rgba(212, 175, 55, 0.5));
            animation: lockPulse 2s ease-in-out infinite;
        }
        @keyframes lockPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }

        .login-card h1 {
            background: linear-gradient(90deg, #d4af37, #ffd700, #d4af37);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 6px;
            font-size: 32px;
            font-weight: 800;
            letter-spacing: 2px;
        }

        .login-card p {
            color: #b8a578;
            margin-bottom: 28px;
            font-size: 13px;
            letter-spacing: 1.5px;
            font-weight: 600;
        }

        .input-group {
            position: relative;
            margin-bottom: 16px;
            text-align: left;
        }
        .input-group .input-icon {
            position: absolute;
            left: 16px; top: 50%;
            transform: translateY(-50%);
            font-size: 16px;
            z-index: 2;
            opacity: 0.7;
        }

        .login-card input {
            width: 100%;
            padding: 15px 16px 15px 44px;
            border: 2px solid rgba(212, 175, 55, 0.2);
            border-radius: 12px;
            outline: none;
            background: rgba(255, 255, 255, 0.04);
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            transition: all 0.25s ease;
        }
        .login-card input::placeholder {
            color: #7a6a4a;
            font-weight: 500;
        }
        .login-card input:focus {
            background: rgba(255, 255, 255, 0.08);
            border-color: #d4af37;
            box-shadow: 0 0 0 4px rgba(212, 175, 55, 0.15);
            transform: translateY(-1px);
        }

        .login-card button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 800;
            letter-spacing: 1.5px;
            color: #1a0f00;
            background: linear-gradient(145deg, #ffd700, #d4af37, #b8860b);
            background-size: 200% 200%;
            margin-top: 6px;
            box-shadow:
                0 5px 0 #5a3f0a,
                0 10px 30px rgba(212, 175, 55, 0.3);
            transition: all 0.15s ease;
            animation: shimmerBtn 3s ease infinite;
            text-shadow: 0 1px 1px rgba(255, 255, 255, 0.3);
        }
        @keyframes shimmerBtn {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        .login-card button:hover {
            filter: brightness(1.1);
        }
        .login-card button:active {
            transform: translateY(5px);
            box-shadow: 0 1px 0 #5a3f0a;
        }

        .error-msg {
            color: #ff6b6b;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 12px;
            padding: 8px 10px;
            border-radius: 8px;
            background: rgba(255, 107, 107, 0.1);
            border: 1px solid rgba(255, 107, 107, 0.2);
            display: none;
        }

        .back-btn {
            display: block;
            margin-top: 18px;
            color: #888888;
            text-decoration: none;
            font-size: 13px;
            transition: 0.2s;
            font-weight: 500;
        }
        .back-btn:hover {
            color: #d4af37;
        }

        .login-footer {
            text-align: center;
            font-size: 11px;
            color: #5a4a30;
            margin-top: 16px;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        /* ===== Mobile Responsive ===== */
        @media (max-width: 768px) {
            body {
                overflow-y: auto;
            }

            .container {
                flex-direction: column;
                justify-content: center;
                align-items: center;
                gap: 30px;
                padding: 30px 20px;
                min-height: 100vh;
            }

            .lamp-wrapper {
                width: 150px;
                height: 150px;
            }

            .lamp {
                width: 110px;
            }

            .lamp-glow {
                width: 250px;
                height: 250px;
            }

            .login-card {
                width: 100%;
                max-width: 340px;
                padding: 30px 22px;
            }

            .login-card h1 {
                font-size: 26px;
            }

            .login-logo {
                font-size: 36px;
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- Lamp Section -->
        <div class="lamp-section" id="lampSection">
            <div class="lamp-wrapper">
                <div class="lamp-glow"></div>
                <span class="sparkle s1">✨</span>
                <span class="sparkle s2">✨</span>
                <span class="sparkle s3">✨</span>
                <span class="sparkle s4">✨</span>
                <img src="assets/images/lamp.png" class="lamp" id="lamp" alt="Lamp">
            </div>
        </div>

        <!-- Login Card -->
        <div class="login-card" id="loginCard">
            <div class="login-logo">🔐</div>
            <h1>GoldMate</h1>
            <p>ADMIN LOGIN</p>

            <div class="input-group">
                <span class="input-icon">📧</span>
                <input type="email" id="username" placeholder="Enter your Email">
            </div>

            <div class="input-group">
                <span class="input-icon">🔑</span>
                <input type="password" id="password" placeholder="Enter your Password">
            </div>

            <div class="error-msg" id="errorMsg">❌ Invalid Email or Password!</div>

            <button id="loginBtn">✨ LOGIN ✨</button>

            <a href="index.html" class="back-btn">← Back to Home</a>

            <div class="login-footer">© GoldMate • Secure Admin Access</div>
        </div>

    </div>

    <script>
        const lamp = document.getElementById("lamp");
        const glow = document.querySelector(".lamp-glow");
        const loginCard = document.getElementById("loginCard");
        const lampSection = document.getElementById("lampSection");

        const usernameInput = document.getElementById("username");
        const passwordInput = document.getElementById("password");
        const loginBtn = document.getElementById("loginBtn");
        const errorMsg = document.getElementById("errorMsg");

        // ✅ योग्य Admin credentials
        const VALID_USERNAME = "admin@goldmate.com";
        const VALID_PASSWORD = "123456";

        let lightOn = false;

        // लॅम्प क्लिक केल्यावर लॉगिन कार्ड दिसेल/लपेल
        lamp.addEventListener("click", () => {
            lightOn = !lightOn;

            if (lightOn) {
                document.body.style.background = "radial-gradient(circle at 50% 50%, #2a1800 0%, #000000 70%)";
                glow.style.opacity = "1";
                glow.style.transform = "translate(-50%, -50%) scale(1.25)";
                loginCard.classList.add("show");
                lampSection.classList.add("light-on");
                lamp.style.transform = "scale(1.08)";
            } else {
                document.body.style.background = "radial-gradient(circle at 50% 50%, #1a0f00 0%, #000000 70%)";
                glow.style.opacity = "0";
                glow.style.transform = "translate(-50%, -50%) scale(1)";
                loginCard.classList.remove("show");
                lampSection.classList.remove("light-on");
                lamp.style.transform = "scale(1)";
            }
        });

        // लॉगिन बटण क्लिक केल्यावर तपासणी
        loginBtn.addEventListener("click", () => {
            const user = usernameInput.value.trim();
            const pass = passwordInput.value.trim();

            if (user === VALID_USERNAME && pass === VALID_PASSWORD) {
                // ✅ Login यशस्वी - sessionStorage मध्ये सेट करा
                sessionStorage.setItem("admin_logged_in", "true");
                sessionStorage.setItem("admin_email", user);

                // ✅ Admin Panel ला redirect
                window.location.href = "admin.html";
            } else {
                errorMsg.style.display = "block";
                setTimeout(() => {
                    errorMsg.style.display = "none";
                }, 3000);
            }
        });

        // Enter दाबल्यावरही लॉगिन होईल
        passwordInput.addEventListener("keypress", (e) => {
            if (e.key === "Enter") {
                loginBtn.click();
            }
        });
        usernameInput.addEventListener("keypress", (e) => {
            if (e.key === "Enter") {
                passwordInput.focus();
            }
        });
    </script>

</body>
</html>
